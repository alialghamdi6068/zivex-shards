plugins {
    id 'java'
}

group = 'me.voidflame'
version = '1.0.0'

repositories { mavenCentral(); maven { url = uri('https://repo.papermc.io/repository/maven-public/') } }

dependencies { compileOnly 'io.papermc.paper:paper-api:26.2.build-SNAPSHOT' }

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

processResources { filesMatching('plugin.yml') { expand(version: project.version) } }

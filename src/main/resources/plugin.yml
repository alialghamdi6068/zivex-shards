name: ZivexShards
version: ${version}
main: me.voidflame.zivexshards.ZivexShardsPlugin
api-version: '26.2'
author: Zivex
description: Professional Shards currency and player wallet system.
commands:
  shards:
    description: Open your Shards wallet and manage player transfers.
    usage: /shards [balance|pay|send|transfer|help]
    permission: zivexshards.use
  shardsadmin:
    description: Manage player Shards.
    usage: /shardsadmin <give|take|set|balance|reload>
    permission: zivexshards.admin
permissions:
  zivexshards.use:
    default: true
  zivexshards.admin:
    default: op
